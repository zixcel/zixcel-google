name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.97 --profile minimal
      - name: Test default features
        run: cargo +1.97 test --locked --workspace
      - name: Test all features
        run: cargo +1.97 test --locked --workspace --all-features
      - name: Verify formatting and static analysis
        run: |
          rustup component add rustfmt clippy --toolchain 1.97
          cargo +1.97 fmt --all --check
          cargo +1.97 clippy --locked --workspace --all-targets --all-features -- -D warnings

  footprint:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 7ceb3d119d6b1e78405ed1a9950b7e6284c0cda3
          path: baseline
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Compare two cold native builds without local host execution
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
        run: node candidate/tools/api-import/footprint.mts "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: google-footprint-${{ github.sha }}
          path: footprint.json
          if-no-files-found: error
