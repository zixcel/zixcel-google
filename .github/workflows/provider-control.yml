name: Verify isolated provider control
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.97.1
      - name: Explicitly build the synthetic-test native dependency
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_RELEASE_DEBUG: '0'
        run: |
          cargo build --locked --release -p zixcel-google-cli --bin zix-google
          echo "ZIX_GOOGLE_TEST_BINARY=$GITHUB_WORKSPACE/target/release/zix-google" >> "$GITHUB_ENV"
          echo "ZIX_GOOGLE_TEST_SHA256=$(sha256sum target/release/zix-google | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Test isolated account read/write fixtures
        working-directory: packages/provider-google
        run: |
          npm ci --ignore-scripts
          node ../../tools/api-import/check-lock.mts
          npm test
          node ../../.github/scripts/provider-consumer.mts
          npm pack --ignore-scripts
