[package]
name = "zixcel-google-admin"
version = "0.3.1"
edition = "2024"
rust-version = "1.97"
description = "Bounded Google administrator inventory and existing billing export observations"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-google"
publish = false

[[bin]]
name = "zix-google"
path = "src/main.rs"

[dependencies]
zixcel-bounded-io = { git = "https://github.com/zixcel/zixcel-contracts", rev = "24a7ec9e328987d931cf49dd97ca23a6ae50db2f" }
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[bin]]
name = "zix-google-package"
path = "../../tools/native-release/main.rs"
